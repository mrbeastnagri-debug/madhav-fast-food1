<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Madhav Fast Food - अपने गाँव में घर बैठे Fast Food Order करें">
<title>Madhav Fast Food | Online Food Ordering</title>
<style>
:root{--red:#d62828;--dark:#171717;--yellow:#ffb703;--cream:#fff8ed;--muted:#6b6b6b;--card:#fff;--line:#eee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--dark)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:0 18px}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--red);color:#fff;display:grid;place-items:center}
.hero{padding:55px 0 35px;background:linear-gradient(135deg,#fff,#ffe8c7)}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:8px 0}.hero p{color:var(--muted);font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:10px;flex-wrap:wrap}
.primary,.secondary{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:var(--red);color:#fff}.secondary{background:#f4f4f4;color:#222}
.section{padding:28px 0}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 15px}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px}.cat.active{background:var(--dark);color:#fff}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.food{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 25px #0000000b}.foodPic{height:180px;background:#f3eee8;display:grid;place-items:center;font-size:60px}.foodPic img{width:100%;height:100%;object-fit:cover}.foodBody{padding:15px}.desc{color:var(--muted);min-height:42px}.price{font-weight:900;font-size:20px}.drawer,.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none}.drawer.open,.modal.show{display:block}.drawerBox{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;padding:20px;overflow:auto}.modalBox{background:#fff;width:min(720px,calc(100% - 24px));max-height:90vh;overflow:auto;margin:5vh auto;border-radius:20px;padding:22px;position:relative}.close{position:absolute;right:14px;top:12px;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.cartItem,.step{border:1px solid #eee;border-radius:14px;padding:13px;margin:9px 0;background:#fff}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid #ddd;background:#fff;border-radius:8px;width:32px;height:32px}
.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.form textarea{min-height:85px;resize:vertical}
.success{background:#eaffef;border:1px solid #b9e7c5;border-radius:15px;padding:16px}.muted{color:var(--muted)}.status{font-weight:900}
@media(max-width:800px){.foods{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.foods{grid-template-columns:1fr}.hero{padding-top:35px}.foodPic{height:210px}}
</style>
</head>
<body>
<header class="top"><nav class="wrap">
<div class="brand"><div class="logo">🍔</div><span>Madhav Fast Food</span></div>
<div class="actions"><button class="secondary" onclick="trackPrompt()">Track Order</button><button class="primary" onclick="openCart()">Cart (<span id="count">0</span>)</button><button class="secondary" onclick="openAdmin()">Owner</button></div>
</nav></header>

<section class="hero"><div class="wrap">
<div class="muted" id="contactText">Delivery केवल आपका गाँव में उपलब्ध है।</div>
<h1>Fast Food, सीधे आपके घर तक.</h1>
<p>Fresh food • Easy ordering • Village delivery</p>
<div class="actions"><button class="primary" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Order Now</button><button class="secondary" onclick="callShop()">Call Shop</button><button class="secondary" onclick="waShop()">WhatsApp</button></div>
</div></section>

<section class="section wrap" id="menu"><div class="row"><div><h2>Our Menu</h2><p class="muted">आज उपलब्ध items</p></div></div><div id="cats" class="cats"></div><div id="foods" class="foods"></div></section>

<div id="drawer" class="drawer"><div class="drawerBox">
<div class="row"><h2>Your Cart</h2><button class="secondary" onclick="closeCart()">Close</button></div>
<div id="cartItems"></div><div id="cartSummary"></div>
<hr><h3>Checkout</h3>
<div class="form">
<input id="name" placeholder="Customer Name">
<input id="phone" inputmode="numeric" placeholder="Mobile Number">
<input id="village" placeholder="Village Name">
<textarea id="address" placeholder="Full Address"></textarea>
<select id="payment"><option>Cash on Counter / Delivery</option><option>UPI</option></select>
<textarea id="note" placeholder="Order note (optional)"></textarea>
<button class="primary" onclick="placeOrder()">Order Place करें</button>
</div>
</div></div>

<div id="modal" class="modal"><div class="modalBox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= SUPABASE CONFIG =================
   1) Supabase dashboard -> Project Settings -> API
   2) Put your Project URL and anon/public key below.
   Never put the service_role/secret key here.
===================================================== */
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const defaults={
 restaurant:"Madhav Fast Food",village:"आपका गाँव",phone:"",whatsapp:"",delivery:20,minOrder:0,
 open:"10:00",close:"22:00",upi:"",
 categories:[{id:1,name:"Burgers"},{id:2,name:"Pizza"},{id:3,name:"Momos"},{id:4,name:"Chowmein"},{id:5,name:"Fries"},{id:6,name:"Cold Drinks"}]
};
let data={...defaults,categories:[...defaults.categories],items:[]},cart=JSON.parse(localStorage.getItem("mff_cart")||"[]"),activeCat="all",currentOrder=null;

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function money(n){return "₹"+Number(n||0)}
function saveCart(){localStorage.setItem("mff_cart",JSON.stringify(cart))}
function updateCount(){document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.qty,0)}

async function loadSettings(){
 const {data:rows,error}=await sb.from("restaurant_settings").select("*").eq("id",1).maybeSingle();
 if(!error&&rows) data={...data,...rows};
 document.getElementById("contactText").textContent="Delivery केवल "+data.village+" में उपलब्ध है।";
}
async function loadMenu(){
 const {data:rows,error}=await sb.from("dishes").select("*").order("created_at",{ascending:true});
 if(error){console.error(error);document.getElementById("foods").innerHTML='<p>Menu load नहीं हुआ। Supabase setup check करें.</p>';return}
 data.items=rows||[];renderCats();renderFoods();syncCartWithMenu();
}
function syncCartWithMenu(){cart=cart.filter(c=>data.items.some(i=>i.id===c.id&&i.available));saveCart();updateCount()}
function renderCats(){document.getElementById("cats").innerHTML='<button class="cat '+(activeCat==="all"?"active":"")+'" onclick="setCat(\'all\')">All</button>'+data.categories.map(c=>`<button class="cat ${activeCat==c.id?"active":""}" onclick="setCat(${c.id})">${esc(c.name)}</button>`).join("")}
function setCat(c){activeCat=c;renderCats();renderFoods()}
function renderFoods(){
 const arr=data.items.filter(x=>x.available&&(activeCat==="all"||x.category_id==activeCat));
 document.getElementById("foods").innerHTML=arr.map(x=>`<article class="food">
 <div class="foodPic">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}">`:(x.emoji||"🍽️")}</div>
 <div class="foodBody"><h3>${esc(x.name)}</h3><div class="desc">${esc(x.description||"")}</div>
 <div class="row"><span class="price">${money(x.price)}</span><button class="primary" onclick="add('${x.id}')">Add +</button></div></div></article>`).join("")||"<p>No items available.</p>"
}
function add(id){let q=cart.find(x=>x.id===id);q?q.qty++:cart.push({id,qty:1});saveCart();updateCount()}
function openCart(){renderCart();document.getElementById("drawer").classList.add("open")}
function closeCart(){document.getElementById("drawer").classList.remove("open")}
function renderCart(){
 const box=document.getElementById("cartItems"),summary=document.getElementById("cartSummary");
 if(!cart.length){box.innerHTML="<p>Your cart is empty.</p>";summary.innerHTML="";return}
 let sub=0;
 box.innerHTML=cart.map(c=>{let x=data.items.find(i=>i.id===c.id);if(!x)return"";let t=x.price*c.qty;sub+=t;return `<div class="cartItem"><div><b>${esc(x.name)}</b><br>${money(x.price)} × ${c.qty}</div><div class="qty"><button onclick="change('${x.id}',-1)">−</button>${c.qty}<button onclick="change('${x.id}',1)">+</button></div></div>`}).join("");
 let total=sub+Number(data.delivery||0);
 summary.innerHTML=`<div class="row"><b>Subtotal</b><b>${money(sub)}</b></div><div class="row"><span>Delivery</span><span>${money(data.delivery||0)}</span></div><div class="row" style="font-size:20px;margin-top:8px"><b>Total</b><b>${money(total)}</b></div>`;
}
function change(id,d){let q=cart.find(x=>x.id===id);if(!q)return;q.qty+=d;if(q.qty<=0)cart=cart.filter(x=>x.id!==id);saveCart();updateCount();renderCart()}

async function placeOrder(){
 if(!cart.length){alert("Cart खाली है");return}
 const n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.replace(/\D/g,""),v=document.getElementById("village").value.trim(),a=document.getElementById("address").value.trim(),pay=document.getElementById("payment").value,noteVal=document.getElementById("note").value.trim();
 if(!n||!p||!v||!a){alert("कृपया Name, Mobile, Village और Address भरें।");return}
 if(!/^[6-9]\d{9}$/.test(p)){alert("कृपया valid 10 digit mobile number डालें।");return}
 const shopVillage=(data.village||"").trim();
 if(shopVillage&&shopVillage!=="आपका गाँव"&&v.toLowerCase()!==shopVillage.toLowerCase()){alert("Sorry, delivery केवल "+shopVillage+" में available है।");return}
 const freshIds=cart.map(c=>c.id);
 const {data:latest,error:menuErr}=await sb.from("dishes").select("*").in("id",freshIds);
 if(menuErr||!latest||latest.length!==cart.length||cart.some(c=>{let x=latest.find(i=>i.id===c.id);return !x||!x.available})){alert("Cart में कोई item अब unavailable है। Menu refresh करके फिर try करें।");await loadMenu();return}
 let sub=cart.reduce((sum,c)=>{let x=latest.find(i=>i.id===c.id);return sum+Number(x.price)*c.qty},0);
 if(sub<Number(data.minOrder||0)){alert("Minimum order "+money(data.minOrder)+" है।");return}
 const items=cart.map(c=>{const x=latest.find(i=>i.id===c.id);return{name:x.name,price:Number(x.price),qty:Number(c.qty)}})
 const {data:o,error}=await sb.from("orders").insert({customer_name:n,phone:p,village:v,address:a,payment:pay,note:noteVal,items,subtotal:sub,delivery:Number(data.delivery||0),total:sub+Number(data.delivery||0),status:"Order Received"}).select("*").single();
 if(error){console.error(error);alert("Order place नहीं हुआ. Supabase RLS/setup check करें.");return}
 cart=[];saveCart();updateCount();closeCart();showOrder(o)
}
function showOrder(o){currentOrder=o;modalContent.innerHTML=`<div class="success"><h2>✅ Order Successfully Placed!</h2><p>Your Order ID: <b>${esc(o.order_code)}</b></p><p>Thank you, ${esc(o.customer_name)}.</p></div><h3>Order Summary</h3>${o.items.map(i=>`<p>${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</p>`).join("")}<hr><div class="row"><b>Total</b><b>${money(o.total)}</b></div><p>Status: <b id="orderStatus">${esc(o.status)}</b></p><button class="primary" onclick="trackOrder(o.order_code)">Track My Order</button>`;modal.classList.add("show")}
async function trackOrder(code,phoneOverride=""){const phone=phoneOverride||currentOrder?.phone||"";let q=sb.from("orders").select("*").eq("order_code",code).limit(1);if(phone)q=q.eq("phone",phone);const {data:o,error}=await q.maybeSingle();if(error||!o){modalContent.innerHTML="<p>Order नहीं मिला. Order ID और mobile number check करें.</p>";return}currentOrder=o;modalContent.innerHTML=`<h2>Order ${esc(o.order_code)}</h2><p>Customer: ${esc(o.customer_name)}</p><p>Total: <b>${money(o.total)}</b></p><h3>Status</h3><p class="status" style="font-size:22px">${esc(o.status)}</p><p>Order flow: Received → Accepted → Preparing → Out for Delivery → Delivered</p>`;modal.classList.add("show")}
function trackPrompt(){modalContent.innerHTML=`<h2>Track Your Order</h2><div class="form"><input id="trackId" placeholder="Order ID e.g. MFF-1001"><input id="trackPhone" inputmode="numeric" placeholder="Mobile Number"><button class="primary" onclick="trackOrder(document.getElementById('trackId').value.trim(),document.getElementById('trackPhone').value.replace(/\\D/g,''))">Track</button></div>`;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
function callShop(){if(data.phone)location.href="tel:"+data.phone;else alert("Owner phone number अभी set नहीं है।")}
function waShop(){if(data.whatsapp)location.href="https://wa.me/"+data.whatsapp.replace(/\D/g,"");else alert("WhatsApp number अभी set नहीं है।")}

async function openAdmin(){
 const {data:{session}}=await sb.auth.getSession();
 if(session){await renderAdmin();return}
 modalContent.innerHTML=`<h2>Owner Dashboard</h2><p class="muted">Secure login (Supabase Auth)</p><div class="form"><input id="adminEmail" type="email" placeholder="Admin email"><input id="adminPass" type="password" placeholder="Password"><button class="primary" onclick="adminLogin()">Login</button></div>`;modal.classList.add("show")
}
async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim(),pass=document.getElementById("adminPass").value;
 const {error}=await sb.auth.signInWithPassword({email,password:pass});
 if(error){alert("Login failed: "+error.message);return}
 await renderAdmin()
}
async function adminLogout(){await sb.auth.signOut();closeModal();alert("Logged out")}
async function renderAdmin(){
 const {data:{session}}=await sb.auth.getSession();if(!session){openAdmin();return}
 const [{data:orders},{data:settings}]=await Promise.all([sb.from("orders").select("*").order("created_at",{ascending:false}),sb.from("restaurant_settings").select("*").eq("id",1).maybeSingle()]);
 if(settings)data={...data,...settings};
 modalContent.innerHTML=`<h2>Owner Dashboard</h2><div class="actions"><button class="secondary" onclick="loadMenu();renderAdmin()">Refresh</button><button class="secondary" onclick="adminLogout()">Logout</button></div>
 <div class="step"><b>Orders: ${(orders||[]).length}</b><br>Today: ${(orders||[]).filter(o=>o.created_at.slice(0,10)===new Date().toISOString().slice(0,10)).length}</div>
 <h3>Orders</h3>${(orders||[]).map(o=>`<div class="step"><b>${esc(o.order_code)} — ${esc(o.status)}</b><p>${esc(o.customer_name)} • ${esc(o.phone)}<br>${esc(o.village)}<br>${esc(o.address)}<br>${o.items.map(i=>esc(i.name)+" × "+i.qty).join(", ")}<br><b>${money(o.total)}</b></p><select onchange="statusOrder('${o.id}',this.value)">${["Order Received","Accepted","Preparing","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"<p>No orders yet.</p>"}
 <h3>Quick Settings</h3><div class="form"><input id="setVillage" value="${esc(data.village||"")}" placeholder="Village name"><input id="setPhone" value="${esc(data.phone||"")}" placeholder="Phone"><input id="setWA" value="${esc(data.whatsapp||"")}" placeholder="WhatsApp number"><input id="setDelivery" type="number" value="${Number(data.delivery||0)}" placeholder="Delivery charge"><input id="setMinOrder" type="number" value="${Number(data.minOrder||0)}" placeholder="Minimum order"><button class="primary" onclick="saveSettings()">Save Settings</button></div>
 <h3>🍔 Menu Management</h3><button class="primary" onclick="newItem()">+ Add New Dish</button><div style="display:grid;gap:12px;margin-top:12px">${data.items.map(adminItemCard).join("")}</div>`;
}
function adminItemCard(x){return `<div class="step"><div class="row"><b>${esc(x.name)}</b><span>${money(x.price)}</span></div><div style="display:flex;gap:12px;align-items:center;margin:10px 0">${x.image_url?`<img src="${esc(x.image_url)}" style="width:75px;height:75px;object-fit:cover;border-radius:12px">`:`<div style="width:75px;height:75px;background:#eee;border-radius:12px;display:grid;place-items:center;font-size:30px">${x.emoji||"🍽️"}</div>`}<div><small>${esc(x.description||"")}</small><br><small>${x.available?"🟢 Available":"🔴 Unavailable"}</small></div></div><button class="secondary" onclick="editItem('${x.id}')">Edit Dish</button> <button class="secondary" onclick="toggleItem('${x.id}')">${x.available?"Hide":"Show"}</button> <button class="secondary" onclick="deleteItem('${x.id}')">Delete</button></div>`}
function itemForm(x){modalContent.innerHTML=`<h2>${x?"Edit Dish":"Add New Dish"}</h2><div class="form"><input id="iName" value="${esc(x?.name||"")}" placeholder="Dish name"><input id="iPrice" type="number" min="0" value="${x?.price??""}" placeholder="Price"><textarea id="iDesc" placeholder="Description">${esc(x?.description||"")}</textarea><select id="iCat">${data.categories.map(c=>`<option value="${c.id}" ${x?.category_id==c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><label>Dish Image <input id="iImage" type="file" accept="image/*"></label>${x?.image_url?`<img src="${esc(x.image_url)}" style="width:120px;height:120px;object-fit:cover;border-radius:14px">`:""}<label><input id="iAvail" type="checkbox" ${x?.available!==false?"checked":""}> Available</label><button class="primary" onclick="saveItem('${x?.id||""}')">Save Dish</button></div>`;modal.classList.add("show")}
function newItem(){itemForm(null)}
function editItem(id){itemForm(data.items.find(x=>x.id===id))}
async function saveItem(id){
 const name=document.getElementById("iName").value.trim(),price=Number(document.getElementById("iPrice").value),description=document.getElementById("iDesc").value.trim(),category_id=Number(document.getElementById("iCat").value),available=document.getElementById("iAvail").checked,file=document.getElementById("iImage").files[0];
 if(!name||!price){alert("Dish name और price भरें।");return}
 let image_url=id?(data.items.find(x=>x.id===id)?.image_url||null):null;
 if(file){
   const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
   const path=`${crypto.randomUUID()}.${ext}`;
   const {error:upErr}=await sb.storage.from("dish-images").upload(path,file,{upsert:false});
   if(upErr){alert("Image upload failed: "+upErr.message);return}
   image_url=sb.storage.from("dish-images").getPublicUrl(path).data.publicUrl;
 }
 const payload={name,price,description,category_id,available,image_url};
 let res;
 if(id)res=await sb.from("dishes").update(payload).eq("id",id);
 else res=await sb.from("dishes").insert(payload);
 if(res.error){alert("Dish save failed: "+res.error.message);return}
 await loadMenu();await renderAdmin();alert("Dish saved. Ab image sab customers ko same menu me dikhegi.")
}
async function toggleItem(id){const x=data.items.find(i=>i.id===id);if(!x)return;const {error}=await sb.from("dishes").update({available:!x.available}).eq("id",id);if(error)alert(error.message);else{await loadMenu();await renderAdmin()}}
async function deleteItem(id){if(!confirm("Is dish ko delete karna hai?"))return;const {error}=await sb.from("dishes").delete().eq("id",id);if(error){alert(error.message);return}cart=cart.filter(c=>c.id!==id);saveCart();await loadMenu();await renderAdmin()}
async function statusOrder(id,s){const {error}=await sb.from("orders").update({status:s,updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else{await renderAdmin()}}
async function saveSettings(){
 const payload={id:1,village:document.getElementById("setVillage").value.trim()||"आपका गाँव",phone:document.getElementById("setPhone").value.trim(),whatsapp:document.getElementById("setWA").value.trim(),delivery:Number(document.getElementById("setDelivery").value||0),minOrder:Number(document.getElementById("setMinOrder").value||0)};
 const {error}=await sb.from("restaurant_settings").upsert(payload);
 if(error){alert(error.message);return}
 await loadSettings();closeModal();alert("Settings saved.")
}

function subscribeRealtime(){
 sb.channel("madhav-public-menu").on("postgres_changes",{event:"*",schema:"public",table:"dishes"},()=>loadMenu()).subscribe();
 sb.channel("madhav-order-status").on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders"},payload=>{
   if(currentOrder&&payload.new.id===currentOrder.id){currentOrder=payload.new;const el=document.getElementById("orderStatus");if(el)el.textContent=payload.new.status;}
 }).subscribe();
}
(async function init(){
 if(SUPABASE_URL.includes("PASTE_")||SUPABASE_ANON_KEY.includes("PASTE_")){
   document.getElementById("foods").innerHTML='<p><b>Setup बाकी है:</b> index.html में Supabase URL और anon key डालें.</p>';
   updateCount();return;
 }
 await loadSettings();await loadMenu();updateCount();subscribeRealtime();
})();
</script>
</body>
</html>
